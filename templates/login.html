{% extends "base.html" %}
{% block title %}Login | Savanna{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo-large">📶</div>
    <h1>HAFIDHI WFI</h1>
    <p class="muted">Wireless Internet Management System</p>
    <form method="post">
      <label>Username</label>
      <input name="username" autocomplete="username" required>
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button class="btn primary full">Sign In</button>
    </form>
    <div class="demo-note">New staff sign in with the username and temporary password provided by the Super Admin. Change your password after your first sign-in.</div>
  </div>
</div>
{% endblock %}
