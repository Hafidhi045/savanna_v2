{% extends "base.html" %}
{% block title %}Change Password | HAFIDHI WFI{% endblock %}
{% block content %}
<div class="form-page">
  <section class="panel">
    <div class="topbar">
      <div>
        <h1>Change password</h1>
        <p class="muted">Use your current password to set a new one.</p>
      </div>
    </div>
    <form method="post">
      <label for="current-password">Current password</label>
      <input class="input" id="current-password" type="password" name="current_password" autocomplete="current-password" required>
      <label for="new-password">New password</label>
      <input class="input" id="new-password" type="password" name="new_password" minlength="8" autocomplete="new-password" required>
      <label for="confirm-password">Confirm new password</label>
      <input class="input" id="confirm-password" type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
      <button class="btn primary" type="submit">Update password</button>
    </form>
  </section>
</div>
{% endblock %}
